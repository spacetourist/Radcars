<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#10261d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Radcars" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Radcars</title>
  <!-- js/version.js is the single source of truth for the build; always fetched fresh, it writes the stylesheet, an
       import map and the main module with ?b=<build> so no browser cache can mix old and new files. -->
  <script>document.write('<script src="js/version.js?t=' + Date.now() + '"><\/script>');</script>
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>
    <!-- v51: menu-only photo backdrop (images are attached lazily by js/ui.js after first paint; hidden during races) -->
    <div id="menu-bg"><div class="mb-layer mb-dim"></div><div class="mb-layer mb-blur"></div><div class="mb-kerb"></div></div>
    <div id="ui"></div>
    <div id="touch-controls" class="hidden"><!-- v53: built by js/controls.js from CONTROL_LAYOUT --></div>
  </div>
</body>
</html>

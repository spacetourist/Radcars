<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07080c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Radcars" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Russo+One&display=swap" rel="stylesheet" />
  <title>Radcars</title>
  <!-- js/version.js is the single source of truth for the build; always fetched fresh, it writes the stylesheet, an
       import map and the main module with ?b=<build> so no browser cache can mix old and new files. -->
  <script>document.write('<script src="js/version.js?t=' + Date.now() + '"><\/script>');</script>
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <div id="touch-controls" class="hidden">
      <div class="tc-aim-pad" id="aim-pad" aria-label="Steering direction">
        <div class="tc-aim-ring"></div>
        <div class="tc-aim-cross"></div>
        <div class="tc-aim-knob" id="aim-knob"></div>
        <div class="tc-aim-label">STEER</div>
      </div>
      <div class="tc-right" aria-label="Throttle: hold GAS, slide up to boost, slide left to fire a missile">
        <button type="button" id="btn-accel" class="tc-btn tc-accel" data-action="accel">GAS<span class="tc-hint">▲ boost · ◀ missile</span></button>
      </div>
      <button type="button" id="btn-pause" class="tc-btn tc-pause" data-action="pause">❚❚</button>
    </div>
  </div>
</body>
</html>
